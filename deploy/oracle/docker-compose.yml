services:
  app:
    build: .
    restart: always
    env_file: .env
    volumes:
      - appdata:/app/state
    environment:
      APP_DB_PATH: /app/state/app_data.db
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:7860
    volumes:
      - caddy:/data
volumes:
  appdata:
  caddy:
